<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prepositions Challenge</title>
    <!-- Google Sign-in API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="bg-symbols" id="bg-symbols"></div>
    <div id="confetti-container"></div>

    <div class="container" id="app-container">
        
        <!-- Menu Screen -->
        <div id="menu-screen" class="screen active">
            <h1>🔔 PREPOSITIONS 🔔<br>CHALLENGE</h1>
            
            <div class="auth-section">
                <div id="google-btn-container" style="display: flex; justify-content: center; min-height: 40px;"></div>
                <div id="user-welcome" style="display: none; color: var(--dora-blue-dark); font-weight: 600; font-size: 18px;"></div>
                <p id="login-hint" style="margin: 8px 0 0; color: #888; font-size: 13px;">💡 Sign in with Google to save your high scores!</p>
            </div>

            <div class="form-group">
                <label>Select Level :</label>
                <select id="question-type">
                    <option value="easy">🌱 Level 1: Easy Mode (Basic)</option>
                    <option value="hard">🔥 Level 2: Hard Mode (Advanced)</option>
                    <option value="challenge">🏆 Level 3: Challenge Mode (Sentence Fill-in-the-blanks)</option>
                </select>
            </div>
            
            <button class="btn" onclick="startGame('infinite')">♾️ Infinite Practice</button>
            <button class="btn rank-btn" onclick="startGame('timed')">⏱️ 3-Min Timed Challenge</button>
            
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 5px;">
                <button class="btn secondary" onclick="showLeaderboard()">📊 Leaderboard</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="stats-bar">
                <span id="time-display" style="color: var(--text-main);">TIME: 03:00</span>
                <span id="score-display" style="display: none; color: var(--dora-red-dark);">🔔 SCORE: 0</span>
                <span id="progress-display" style="color: #00b894;">✔ 0/0</span>
            </div>
            <div id="level-display" style="color: var(--dora-blue-dark); font-weight: 600; margin-bottom:10px; font-size: 16px;"></div>
            
            <div class="question-box" id="question-text">be mean ____</div>
            
            <!-- Multiple Choice Grid -->
            <div id="choices-container" class="choices-grid">
                <!-- Preposition buttons injected via JS -->
            </div>

            <button class="btn outline-btn" onclick="confirmExit()" style="margin-top: 10px;">🏠 Exit Practice</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>TASK COMPLETE! 🎉</h2>
            <div id="final-stats" style="font-size: 18px; line-height: 1.8; margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 20px; border: 3px solid var(--border-color);"></div>
            
            <div id="upload-section" class="form-group" style="display: none; background: #fff; padding: 15px; border-radius: 20px; border: 3px solid var(--dora-yellow-dark);">
                <label style="color: var(--dora-blue-dark); text-align: center; font-size: 18px;">🔥 Save High Score</label>
                
                <div style="text-align: center; margin-bottom: 12px; font-size: 16px; font-weight: 600;">
                    Player: <span id="upload-name-display" style="color: var(--dora-red); text-decoration: underline;"></span>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <select id="class-select" style="flex: 1;">
                        <option value="5A">5A</option>
                        <option value="5B">5B</option>
                        <option value="5C">5C</option>
                        <option value="5D">5D</option>
                        <option value="5E">5E</option>
                    </select>
                    <input type="number" id="student-num" placeholder="No. (1-40)" min="1" max="40" style="flex: 2;">
                </div>
                <button class="btn rank-btn" id="submit-score-btn" onclick="submitScore()">🚀 Upload Score</button>
            </div>
            
            <button class="btn secondary" onclick="showScreen('menu-screen')">🏠 Main Menu</button>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <h2>🏆 LEADERBOARD</h2>
            <div class="leaderboard-filters">
                <select id="filter-mode" onchange="fetchLeaderboard()">
                    <option value="timed_easy">⏱️ Level 1: Easy Mode</option>
                    <option value="timed_hard">⏱️ Level 2: Hard Mode</option>
                    <option value="timed_challenge">🏆 Level 3: Challenge Mode</option>
                </select>
                
                <select id="filter-class" onchange="fetchLeaderboard()">
                    <option value="ALL">🌟 All Classes</option>
                    <option value="5A">5A</option>
                    <option value="5B">5B</option>
                    <option value="5C">5C</option>
                    <option value="5D">5D</option>
                    <option value="5E">5E</option>
                </select>
            </div>
            <div class="table-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th>CLASS</th>
                            <th>NO.</th>
                            <th>NAME</th>
                            <th>SCORE</th>
                            <th>ACC</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            <br>
            <button class="btn secondary" onclick="showScreen('menu-screen')">🏠 Back</button>
        </div>

    </div>

    <script src="js/questions.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/game.js"></script>
    <script type="module" src="js/firebase.js"></script>
</body>
</html>
