<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prepositions Challenge</title>
    <!-- Google Sign-in API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dora-blue: #0099ff;
            --dora-blue-dark: #007acc;
            --dora-red: #ff3333;
            --dora-red-dark: #cc0000;
            --dora-yellow: #ffcc00;
            --dora-yellow-dark: #e6b800;
            --dora-sky: #e6f5ff;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --correct-bg: #e8f8f5;
            --wrong-bg: #ffeaa7;
            --border-color: #b3e0ff;
        }

        body {
            font-family: 'Fredoka', 'M PLUS Rounded 1c', cursive, sans-serif;
            background-color: var(--dora-sky);
            background-image: 
                radial-gradient(#80ccff 2px, transparent 2px), 
                radial-gradient(#ff9999 2px, var(--dora-sky) 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; 
            touch-action: manipulation;
        }

        /* Floating background items */
        .bg-symbols {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .symbol {
            position: absolute; font-size: 2.2rem;
            animation: floatUp 9s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Card Container */
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 28px;
            border: 4px solid var(--dora-blue);
            box-shadow: 0 12px 25px rgba(0, 153, 255, 0.3);
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 10;
            max-height: 98vh;
            overflow-y: auto;
        }

        h1 { 
            color: var(--dora-blue-dark); 
            font-size: 26px;
            font-weight: 700;
            margin-top: 0; 
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--dora-blue);
            letter-spacing: 0.5px;
        }

        h2 {
            color: var(--dora-blue-dark);
            font-size: 20px;
            font-weight: 700;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: doraBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes doraBounce {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            50% { transform: translateY(-8px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text-main); font-size: 16px; }
        
        select, input[type="number"], input[type="text"] {
            width: 100%; padding: 12px 16px; border-radius: 20px; border: 3px solid var(--dora-blue); 
            font-size: 16px; font-family: 'Fredoka', cursive; box-sizing: border-box; 
            transition: border-color 0.2s; background: #fff; color: var(--text-main);
            outline: none;
        }
        select:focus, input:focus { border-color: var(--dora-red); }

        .btn {
            background-color: var(--dora-blue); 
            color: #fff; 
            border: none;
            padding: 14px 20px;
            border-radius: 25px; 
            font-size: 18px; 
            font-family: 'Fredoka', cursive;
            font-weight: 600; 
            cursor: pointer; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            box-shadow: 0 6px 0 var(--dora-blue-dark);
            transition: all 0.15s ease;
        }
        .btn:hover { 
            background-color: #33adff; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 0 var(--dora-blue-dark); 
        }
        .btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 2px 0 var(--dora-blue-dark); 
        }
        
        .btn.secondary { 
            background-color: var(--dora-red); 
            box-shadow: 0 6px 0 var(--dora-red-dark); 
        }
        .btn.secondary:hover { 
            background-color: #ff6666; 
            box-shadow: 0 8px 0 var(--dora-red-dark); 
        }
        
        .btn.rank-btn { 
            background-color: var(--dora-yellow); 
            color: var(--text-main); 
            box-shadow: 0 6px 0 var(--dora-yellow-dark); 
        }
        .btn.rank-btn:hover { 
            background-color: #ffd633; 
            box-shadow: 0 8px 0 var(--dora-yellow-dark); 
        }

        .btn.outline-btn { 
            background-color: #ffffff; color: var(--text-main); border: 3px solid var(--border-color); 
            box-shadow: 0 4px 0 var(--border-color); margin-top: 5px; padding: 10px; 
        }
        .btn.outline-btn:hover { background-color: var(--dora-sky); transform: translateY(-2px); }

        .stats-bar {
            display: flex; justify-content: space-between; background: var(--dora-yellow); 
            border: 3px solid var(--dora-yellow-dark); padding: 10px 15px; border-radius: 20px; 
            font-size: 15px; margin-bottom: 15px; font-weight: 600; color: var(--text-main);
            box-shadow: 0 4px 0 var(--dora-yellow-dark);
        }

        /* Question Box Styling */
        .question-box {
            font-size: 26px; font-weight: normal; margin: 10px 0 20px 0; color: var(--text-main); 
            min-height: 80px; display: flex; align-items: center; justify-content: center;
            background: #fff; border: 3px dashed var(--dora-blue); border-radius: 20px;
            padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            line-height: 1.4;
        }
        
        .target-tense {
            font-size: 14px; color: var(--dora-red); font-weight: 600; margin-bottom: 8px; 
            text-transform: uppercase; letter-spacing: 1px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Preposition Choice Buttons */
        .choice-btn {
            background: #ffffff;
            border: 3px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 8px;
            font-size: 22px;
            font-family: 'Fredoka', cursive;
            font-weight: normal;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s;
            text-transform: lowercase;
            box-shadow: 0 5px 0 var(--border-color);
            user-select: none;
            touch-action: manipulation;
        }
        .choice-btn:hover {
            background-color: var(--dora-sky);
            border-color: var(--dora-blue);
            transform: translateY(-2px);
            box-shadow: 0 7px 0 var(--dora-blue);
        }
        .choice-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--dora-blue);
        }

        @keyframes pop { 50% { transform: scale(1.05); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .feedback-correct { animation: pop 0.3s ease; background-color: var(--correct-bg) !important; border-color: #55efc4 !important; }
        .feedback-wrong { animation: shake 0.3s ease; background-color: var(--wrong-bg) !important; border-color: #fab1a0 !important; }

        .table-container { max-height: 320px; overflow-y: auto; border-radius: 15px; border: 3px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border-bottom: 2px solid var(--dora-sky); padding: 10px; text-align: center; font-size: 15px; }
        th { background-color: var(--dora-blue); color: white; position: sticky; top: 0; white-space: nowrap; font-size: 13px; font-weight: 600; }
        tr:nth-child(even) { background-color: #f0f9ff; }
        tr:hover { background-color: var(--dora-yellow); }

        .leaderboard-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .leaderboard-filters select { flex: 1; min-width: 140px; }

        #confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 50%; }
        
        .auth-section {
            background: #fff; border: 3px solid var(--border-color); border-radius: 20px;
            padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        /* Doraemon Incorrect Answer Modal Styles */
        .dora-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .dora-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .dora-modal-card {
            background: #ffffff;
            border: 4px solid var(--dora-blue);
            border-radius: 28px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 153, 255, 0.35);
            transform: scale(0.7) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .dora-modal-overlay.active .dora-modal-card {
            transform: scale(1) translateY(0);
        }

        .dora-modal-header {
            background: #fff5f5;
            border: 3px solid #ff9999;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 16px;
        }

        .dora-modal-title {
            color: var(--dora-red);
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dora-modal-body {
            background: var(--dora-sky);
            border: 3px dashed var(--dora-blue);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .dora-question-preview {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .dora-answer-badge {
            display: inline-block;
            background-color: var(--dora-yellow);
            color: var(--text-main);
            border: 3px solid var(--dora-yellow-dark);
            font-size: 24px;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 0 var(--dora-yellow-dark);
            margin-top: 6px;
        }

        .dora-user-ans {
            font-size: 14px;
            color: var(--dora-red-dark);
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>

    <!-- Background Icons Logic -->
    <script>
        const doraIcons = ['🔔', '🚪', '🚁', '🍞', '🥞', '⭐', '✨'];
        const bgContainer = document.getElementById('bg-symbols');
        for(let i=0; i<15; i++) {
            let el = document.createElement('div');
            el.className = 'symbol';
            el.innerText = doraIcons[Math.floor(Math.random() * doraIcons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 4 + 6) + 's';
            el.style.animationDelay = (Math.random() * 4) + 's';
            bgContainer.appendChild(el);
        }

        function fireConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#0099ff', '#ff3333', '#ffcc00', '#ffffff', '#80ccff'];
            for(let i=0; i<60; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.transition = 'transform 3s ease-in, top 3s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 3s';
                
                const fallX = (Math.random() - 0.5) * 250;
                const fallY = window.innerHeight + 50;
                const rotate = Math.random() * 720;
                container.appendChild(conf);
                
                setTimeout(() => {
                    conf.style.transform = `translateX(${fallX}px) rotate(${rotate}deg)`;
                    conf.style.top = `${fallY}px`;
                    conf.style.opacity = 0;
                }, 50);
            }
        }
    </script>

    <!-- Google Login Logic -->
    <script>
        let currentUser = null; 

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            if(payload) {
                const lastName = payload.family_name || payload.name || "Student"; 
                currentUser = {
                    id: payload.sub,
                    lastName: lastName
                };
                document.getElementById('google-btn-container').style.display = 'none';
                document.getElementById('login-hint').style.display = 'none';
                
                const welcomeEl = document.getElementById('user-welcome');
                welcomeEl.innerText = `🔔 Welcome, ${currentUser.lastName}!`;
                welcomeEl.style.display = 'block';
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "73097478642-sejqkoo47r505bqcj1v2fnfrdpst3qj9.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-btn-container"),
                { theme: "outline", size: "large", shape: "pill", width: 250 }
            );
        };
    </script>

        window.fetchLeaderboard = async () => {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = "<tr><td colspan='6'>Loading... ⏳</td></tr>";
            
            const modeFilter = document.getElementById('filter-mode').value;
            const classFilter = document.getElementById('filter-class').value;
            
            let qType = modeFilter.split('_')[1]; 
            
            let queryConditions = [
                where("gameMode", "==", "timed"),
                where("questionType", "==", qType)
            ];
            
            if (classFilter !== "ALL") {
                queryConditions.push(where("class", "==", classFilter));
            }

            try {
                const q = query(collection(db, "leaderboard"), ...queryConditions, orderBy("score", "desc"), limit(30));
                const querySnapshot = await getDocs(q);
                
                tbody.innerHTML = "";
                let rank = 1;
                
                if(querySnapshot.empty) {
                    tbody.innerHTML = "<tr><td colspan='6'>No high scores yet!</td></tr>";
                    return;
                }
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let rankDisplay = rank === 1 ? "🥇 1" : rank === 2 ? "🥈 2" : rank === 3 ? "🥉 3" : rank;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:bold; color: ${rank<=3?'var(--dora-red)':'inherit'};">${rankDisplay}</td>
                            <td>${data.class}</td>
                            <td>${data.studentNum}</td>
                            <td style="color: var(--dora-blue-dark); font-weight: bold;">${data.lastName || 'Student'}</td>
                            <td style="font-weight:bold; color:var(--dora-blue-dark); font-size:18px;">🔔 ${data.score}</td>
                            <td>${data.accuracy}%</td>
                        </tr>
                    `;
                    rank++;
                });
            } catch (e) {
                console.error("Error fetching docs: ", e);
                tbody.innerHTML = `<tr><td colspan='6' style="color:red; font-size:13px;">
                    Failed to load data. Firebase index may be missing.
                </td></tr>`;
            }
        };
    </script>

    <!-- Game Logic & Question Banks -->
    <script>
        let mode = '';
        let typeLevel = 'easy'; 
        let timer = null;
        let timeLeft = 0;
        
        let stats = { total: 0, correct: 0, score: 0, consecutive: 0 };
        let currentQuestion = { text: "", ans: "" };
        const container = document.getElementById('app-container');

        // Level 1: Easy Mode Question Bank
        const easyBank = [
            { text: "be mean", ans: "to" },
            { text: "be nice", ans: "to" },
            { text: "say sorry", ans: "to" },
            { text: "share (feelings)", ans: "with" },
            { text: "quarrel / argue", ans: "with" },
            { text: "discuss (a problem)", ans: "with" },
            { text: "agree", ans: "with" },
            { text: "disagree", ans: "with" },
            { text: "get on", ans: "with" },
            { text: "help ... (the homework)", ans: "with" },
            { text: "lie", ans: "to" },
            { text: "be jealous", ans: "of" }
        ];

        // Level 2: Hard Mode Question Bank
        const hardBank = [
            { text: "afraid / scared", ans: "of" },
            { text: "full", ans: "of" },
            { text: "make fun", ans: "of" },
            { text: "take care", ans: "of" },
            { text: "think", ans: "of" },
            { text: "friendly", ans: "to" },
            { text: "listen", ans: "to" },
            { text: "speak", ans: "to" },
            { text: "talk", ans: "to" },
            { text: "write", ans: "to" },
            { text: "careful", ans: "with" },
            { text: "happy", ans: "with" },
            { text: "angry", ans: "with" },
            { text: "make friends", ans: "with" },
            { text: "play", ans: "with" },
            { text: "fight", ans: "with" }
        ];

        // Level 3: Challenge Mode (Sentence Fill-in-the-blanks)
        const challengeBank = [
            { text: "He is always very mean ___ his little sister.", ans: "to" },
            { text: "I am afraid ___ the dark.", ans: "of" },
            { text: "She agreed ___ my plan.", ans: "with" },
            { text: "The glass is full ___ water.", ans: "of" },
            { text: "Don't make fun ___ him.", ans: "of" },
            { text: "You need to speak ___ the manager.", ans: "to" },
            { text: "I like to play ___ my dog.", ans: "with" },
            { text: "Who is going to take care ___ the baby?", ans: "of" },
            { text: "She was very happy ___ her new phone.", ans: "with" },
            { text: "He lied ___ his parents.", ans: "to" },
            { text: "I am jealous ___ her success.", ans: "of" },
            { text: "Please be careful ___ that hot cup.", ans: "with" },
            { text: "I want to discuss this problem ___ you.", ans: "with" },
            { text: "They often quarrel ___ each other.", ans: "with" },
            { text: "She wrote a letter ___ her grandmother.", ans: "to" },
            { text: "It's important to say sorry ___ your friends.", ans: "to" },
            { text: "Are you angry ___ me?", ans: "with" }
        ];

        const typeConfigs = {
            'easy': { bank: easyBank, pts: 10, name: "🌱 Level 1: Easy" },
            'hard': { bank: hardBank, pts: 20, name: "🔥 Level 2: Hard" },
            'challenge': { bank: challengeBank, pts: 30, name: "🏆 Level 3: Challenge" }
        };

        const prepositions = ["to", "of", "with", "at", "for", "about", "in", "on"];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showLeaderboard() {
            showScreen('leaderboard-screen');
            if(window.fetchLeaderboard) window.fetchLeaderboard();
        }

        function confirmExit() {
            if (confirm("Are you sure you want to end the practice?\n⚠️ Progress will be lost!")) {
                clearInterval(timer);
                showScreen('menu-screen');
            }
        }

        function startGame(selectedMode) {
            if (selectedMode === 'timed' && !currentUser) {
                alert('🔔 You must Sign in with Google to play Timed Challenge!');
                return;
            }

            mode = selectedMode;
            stats = { total: 0, correct: 0, score: 0, consecutive: 0 };
            typeLevel = document.getElementById('question-type').value;
            
            document.getElementById('score-display').style.display = (mode === 'timed') ? 'inline' : 'none';
            document.getElementById('level-display').innerText = `${typeConfigs[typeLevel].name}`;
            
            updateStatsUI();
            
            if (mode === 'infinite') {
                document.getElementById('time-display').innerText = "♾️ INFINITE";
                clearInterval(timer);
            } else {
                timeLeft = 180; // 3 minutes
                updateTimeUI();
                clearInterval(timer);
                timer = setInterval(timerTick, 1000);
            }

            showScreen('game-screen');
            generateQuestion();
        }

        function timerTick() {
            timeLeft--;
            updateTimeUI();
            if (timeLeft <= 0) {
                clearInterval(timer);
                endGame();
            }
        }

        function updateTimeUI() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('time-display').innerText = `TIME: ${m}:${s.toString().padStart(2, '0')}`;
            if(timeLeft <= 10 && mode !== 'infinite') {
                document.getElementById('time-display').style.color = 'var(--dora-red-dark)';
            } else {
                document.getElementById('time-display').style.color = 'var(--text-main)';
            }
        }

        function generateQuestion() {
            const bank = typeConfigs[typeLevel].bank;
            const randomIndex = Math.floor(Math.random() * bank.length);
            currentQuestion = bank[randomIndex];
            
            const questionTextEl = document.getElementById('question-text');

            if (currentQuestion.text.includes("___")) {
                questionTextEl.innerText = currentQuestion.text;
            } else {
                questionTextEl.innerText = `${currentQuestion.text} ____`;
            }

            // Options: always include correct answer + 3 choices from preposition pool
            let options = [currentQuestion.ans];
            while (options.length < 4) {
                let randomPrep = prepositions[Math.floor(Math.random() * prepositions.length)];
                if (!options.includes(randomPrep)) {
                    options.push(randomPrep);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                choicesContainer.appendChild(btn);
            });
        }

        function showDoraModal(userChoice) {
            document.getElementById('dora-modal-question').innerText = currentQuestion.text.includes("___") 
                ? currentQuestion.text 
                : `${currentQuestion.text} ____`;
            document.getElementById('dora-modal-answer').innerText = currentQuestion.ans;
            document.getElementById('dora-modal-user-ans').innerHTML = `Your answer: <s style="color:var(--dora-red);">${userChoice}</s>`;
            
            document.getElementById('dora-modal-overlay').classList.add('active');
        }

        function closeDoraModal() {
            document.getElementById('dora-modal-overlay').classList.remove('active');
            generateQuestion();
        }

        function checkAnswer(selectedAns) {
            const isCorrect = selectedAns === currentQuestion.ans;
            
            stats.total++;
            if (isCorrect) {
                stats.correct++;
                stats.consecutive++;
                
                if (mode === 'timed') {
                    stats.score += typeConfigs[typeLevel].pts;
                }
                
                triggerFeedback('correct');
                updateStatsUI();
                generateQuestion();
            } else {
                stats.consecutive = 0; 
                if (mode === 'timed') stats.score = Math.max(0, stats.score - 5);
                triggerFeedback('wrong');
                updateStatsUI();
                
                showDoraModal(selectedAns);
            }
        }

        function triggerFeedback(type) {
            container.classList.remove('feedback-correct', 'feedback-wrong');
            void container.offsetWidth; 
            container.classList.add(`feedback-${type}`);
            setTimeout(() => {
                container.classList.remove(`feedback-${type}`);
            }, 300);
        }

        function updateStatsUI() {
            const acc = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
            document.getElementById('progress-display').innerText = `✔ ${stats.correct}/${stats.total} (${acc}%)`;
            document.getElementById('score-display').innerText = `🔔 SCORE: ${stats.score}`;
        }

        function endGame() {
            showScreen('result-screen');
            const acc = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
            
            let resultHTML = `
                Total Questions: <b style="color:var(--dora-blue-dark)">${stats.total}</b><br>
                Correct Answers: <b style="color:#00b894">${stats.correct}</b><br>
                Accuracy: <b>${acc}%</b><br>
            `;
            
            if (mode === 'timed' && currentUser) {
                resultHTML += `<hr style="border:0; border-top:2px dashed var(--border-color); margin:15px 0;"><span style="color:var(--dora-blue-dark); font-size: 26px; font-weight:700;">FINAL SCORE: 🔔 ${stats.score}</span>`;
                
                document.getElementById('upload-section').style.display = 'block';
                document.getElementById('upload-name-display').innerText = currentUser.lastName;
                document.getElementById('submit-score-btn').disabled = false;
                document.getElementById('submit-score-btn').innerText = "🚀 Upload Score";
                fireConfetti(); 
            } else {
                document.getElementById('upload-section').style.display = 'none';
            }
            
            document.getElementById('final-stats').innerHTML = resultHTML;
        }

        function submitScore() {
            const stuClass = document.getElementById('class-select').value;
            const stuNum = document.getElementById('student-num').value;
            
            if(!stuNum || stuNum < 1 || stuNum > 40) {
                alert("⚠️ Please enter a valid Class Number (1-40) !");
                return;
            }

            const acc = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
            
            const data = {
                exerciseName: prepositions,
                class: stuClass,
                studentNum: parseInt(stuNum),
                lastName: currentUser.lastName,
                googleId: currentUser.id,
                score: stats.score,
                accuracy: acc,
                questionType: typeLevel 
            };

            if(window.saveToFirebase) {
                window.saveToFirebase(data);
            }
        }
    </script>
</body>
